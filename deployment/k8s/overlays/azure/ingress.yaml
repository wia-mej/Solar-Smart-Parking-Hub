apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solarhub
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port: { number: 80 }
