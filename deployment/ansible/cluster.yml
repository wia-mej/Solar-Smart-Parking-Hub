- name: Préparation des deux nœuds
  hosts: cluster
  become: true
  tasks:
    - name: Attendre que la machine accepte les connexions
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Mettre à jour l'index des paquets
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les outils nécessaires
      ansible.builtin.apt:
        name: [curl, ca-certificates, python3-pip]
        state: present

    - name: Désactiver l'espace d'échange
      ansible.builtin.shell: swapoff -a
      changed_when: false

    - name: Rendre la désactivation permanente
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

- name: Serveur k3s sur le nœud de contrôle
  hosts: controle
  become: true
  tasks:
    - name: Télécharger l'installateur
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/installer-k3s.sh
        mode: "0755"

    - name: Installer le serveur
      ansible.builtin.command:
        cmd: /tmp/installer-k3s.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: v1.31.4+k3s1
        INSTALL_K3S_EXEC: >-
          server
          --tls-san {{ ansible_host }}
          --node-ip {{ adresse_privee }}
          --disable traefik
          --disable servicelb
          --write-kubeconfig-mode 644

    - name: Vérifier que l'installation a produit quelque chose
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binaire
      failed_when: not k3s_binaire.stat.exists

    - name: Attendre que le serveur d'API réponde
      ansible.builtin.wait_for:
        port: 6443
        timeout: 300

    - name: Marquer le nœud de contrôle comme non ordonnançable
      ansible.builtin.shell: >
        k3s kubectl taint node {{ ansible_hostname }}
        node-role=controle:NoSchedule --overwrite
      changed_when: false

    - name: Relever le jeton de rattachement
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: jeton_brut

    - name: Conserver le jeton
      ansible.builtin.set_fact:
        jeton_cluster: "{{ jeton_brut.content | b64decode | trim }}"

    - name: Récupérer le fichier d'accès
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: acces_brut

    - name: Écrire le fichier d'accès sur ton poste
      ansible.builtin.copy:
        content: >-
          {{ acces_brut.content | b64decode
             | replace('127.0.0.1', ansible_host) | replace('localhost', ansible_host)
             | replace('default', 'solarhub-azure') }}
        dest: "{{ playbook_dir }}/acces-cluster.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Agent k3s sur le nœud de charge
  hosts: charge
  become: true
  tasks:
    - name: Télécharger l'installateur
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/installer-k3s.sh
        mode: "0755"

    - name: Rattacher le nœud au cluster
      ansible.builtin.command:
        cmd: /tmp/installer-k3s.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: v1.31.4+k3s1
        K3S_URL: "https://{{ hostvars[groups['controle'][0]]['adresse_privee'] }}:6443"
        K3S_TOKEN: "{{ hostvars[groups['controle'][0]]['jeton_cluster'] }}"
        INSTALL_K3S_EXEC: >-
          agent
          --node-ip {{ adresse_privee }}
          --node-label role=applicatif

    - name: Vérifier que l'agent est installé
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: agent
      failed_when: not agent.stat.exists

- name: Vérification de la topologie
  hosts: controle
  become: true
  tasks:
    - name: Attendre que les deux nœuds soient prêts
      ansible.builtin.shell: k3s kubectl get nodes --no-headers
      register: noeuds
      until: noeuds.stdout_lines | length == 2 and 'NotReady' not in noeuds.stdout
      retries: 30
      delay: 10
      changed_when: false

    - name: Afficher l'état
      ansible.builtin.debug:
        msg: "{{ noeuds.stdout_lines }}"
