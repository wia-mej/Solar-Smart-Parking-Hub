name: Backoffice CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'backoffice/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backoffice/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  build-and-push:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice
          file: ./backoffice/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/parkree-backoffice:latest
            ghcr.io/${{ github.repository_owner }}/parkree-backoffice:${{ github.sha }}