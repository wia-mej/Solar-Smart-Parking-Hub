name: AI Service CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'ai-service/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'ai-service/**'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 app tests --max-line-length=100
      - name: Run tests
        run: pytest tests/ -v
