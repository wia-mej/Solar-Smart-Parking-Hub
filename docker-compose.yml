services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=${MONGODB_URI}

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"

  backoffice:
    build:
      context: ./backoffice
    ports:
      - "4200:80"
    depends_on:
      - backend